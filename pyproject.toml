[build-system]
requires = ["setuptools>=84.2.1", "setuptools_scm[toml]>=10.3.4"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.black]
skip-string-normalization = true
target-version = ['py311']

[tool.coverage.report]
omit = []

[tool.isort]
profile = "black"

[tool.mypy]
namespace_packages = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
    -n 2
    -W error
    --cov=src
    --cov=tests
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
    --no-cov-on-fail
"""
